<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="DrinksTC is currently under construction."
    />
    <title>Under construction | DrinksTC</title>

    <style>
      :root {
        color-scheme: dark;
        --background: #09090b;
        --foreground: #ffffff;
        --surface: #18181b;
        --surface-soft: #27272a;
        --border: #3f3f46;
        --muted: #a1a1aa;
        --primary: #ec4899;
        --primary-hover: #f472b6;
        --secondary: #22d3ee;
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
        font-family: Arial, Helvetica, sans-serif;
      }

      body::before,
      body::after {
        position: fixed;
        z-index: 0;
        width: min(42rem, 55vw);
        height: min(42rem, 55vw);
        border-radius: 999px;
        filter: blur(120px);
        opacity: 0.12;
        content: "";
        pointer-events: none;
      }

      body::before {
        top: -20rem;
        right: -10rem;
        background: var(--primary);
      }

      body::after {
        bottom: -22rem;
        left: -12rem;
        background: var(--secondary);
      }

      ::selection {
        background: var(--primary);
        color: var(--foreground);
      }

      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        border-bottom: 1px solid var(--border);
      }

      .header-inner,
      .content,
      .footer-inner {
        width: min(calc(100% - clamp(2rem, 7vw, 9rem)), 115rem);
        margin-inline: auto;
      }

      .header-inner {
        display: flex;
        align-items: center;
        min-height: clamp(4.5rem, 7vh, 6rem);
      }

      .brand {
        margin: 0;
        font-size: clamp(1.125rem, 1.25vw, 1.5rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .content {
        flex: 1;
        display: grid;
        align-items: center;
        padding-block: clamp(2rem, 5vh, 5rem);
      }

      .message {
        position: relative;
        width: 100%;
        min-height: min(67vh, 58rem);
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(19rem, 0.55fr);
        grid-template-rows: auto 1fr;
        gap: clamp(2rem, 5vw, 7rem);
        overflow: hidden;
        border: 1px solid var(--border);
        border-left: 4px solid var(--primary);
        border-radius: 0 var(--radius) var(--radius) 0;
        background:
          linear-gradient(135deg, rgb(236 72 153 / 0.07), transparent 42%),
          var(--surface);
        padding: clamp(2rem, 4.5vw, 6rem);
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.3);
      }

      .message::after {
        position: absolute;
        right: -0.06em;
        bottom: -0.25em;
        color: rgb(255 255 255 / 0.025);
        font-size: clamp(18rem, 30vw, 38rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.1em;
        content: "TC";
        pointer-events: none;
      }

      .status {
        position: relative;
        z-index: 1;
        grid-column: 1 / -1;
        display: inline-flex;
        align-items: center;
        justify-self: start;
        gap: 0.6rem;
        margin: 0 0 1rem;
        color: var(--primary-hover);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .status::before {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 999px;
        background: var(--primary);
        box-shadow: 0 0 0.9rem rgb(236 72 153 / 0.75);
        content: "";
      }

      h1 {
        position: relative;
        z-index: 1;
        align-self: end;
        max-width: 9ch;
        margin: 0;
        font-size: clamp(4rem, 8vw, 9.5rem);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.065em;
      }

      .details {
        position: relative;
        z-index: 1;
        align-self: end;
        border-top: 1px solid var(--border);
        padding-top: 1.5rem;
      }

      .description {
        max-width: 28rem;
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 1.35vw, 1.25rem);
        line-height: 1.7;
      }

      .domain {
        margin: 2rem 0 0;
        color: var(--secondary);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .footer {
        color: var(--muted);
        font-size: 0.875rem;
      }

      .footer-inner {
        border-top: 1px solid var(--border);
        padding-block: clamp(1.25rem, 2vh, 1.75rem);
      }

      .footer p {
        margin: 0;
      }

      @media (max-width: 56rem) {
        body {
          overflow: auto;
        }

        .message {
          min-height: auto;
          grid-template-columns: 1fr;
          grid-template-rows: auto auto auto;
          gap: 2.5rem;
          padding: clamp(1.75rem, 7vw, 3rem);
        }

        h1 {
          max-width: 100%;
          font-size: clamp(3.25rem, 13vw, 6.25rem);
          line-height: 0.94;
          letter-spacing: -0.055em;
        }

        .details {
          width: min(100%, 30rem);
        }
      }

      @media (max-width: 30rem) {
        .header-inner,
        .content,
        .footer-inner {
          width: calc(100% - 2rem);
        }

        .message {
          gap: 2rem;
          padding: 1.75rem;
        }

        .message::after {
          display: none;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .message {
          animation: enter 600ms ease-out both;
        }

        @keyframes enter {
          from {
            opacity: 0;
            transform: translateY(12px);
          }

          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header class="header">
        <div class="header-inner">
          <p class="brand">DrinksTC</p>
        </div>
      </header>

      <main class="content">
        <section class="message" aria-labelledby="page-title">
          <p class="status">Coming soon</p>
          <h1 id="page-title">Under construction.</h1>
          <div class="details">
            <p class="description">
              We&rsquo;re getting the party ready. Check back soon.
            </p>
            <p class="domain">drinkstc.com</p>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-inner">
          <p>&copy; DrinksTC</p>
        </div>
      </footer>
    </div>

    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
